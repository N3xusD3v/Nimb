<main>
  <h1>Flashcards (revisão espaçada)</h1>
  <p style="color:var(--text-dim)" id="stats-line">Carregando...</p>
  <div class="flash-card" id="flash-card" onclick="flipCard()">Carregando...</div>
  <div class="flash-actions" id="flash-actions" style="display:none">
    <button class="secondary" onclick="grade(0)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9.5 9.5 5 5"/><path d="m14.5 9.5-5 5"/></svg>
      Errei
    </button>
    <button class="secondary" onclick="grade(1)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 15h6"/><circle cx="9" cy="10" r="0.7" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="0.7" fill="currentColor" stroke="none"/></svg>
      Difícil
    </button>
    <button onclick="grade(2)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.5 2.5L16 9.3"/></svg>
      Fácil
    </button>
  </div>
</main>
<footer>Nimb · algoritmo de repetição espaçada simplificado (estilo SM-2).</footer>
<script src="js/app.js"></script>
<script src="js/srs.js"></script>
<script>
let CARDS = [];
let QUEUE = [];
let CURRENT = null;
let FLIPPED = false;

async function loadCards() {
  const res = await fetch("data/flashcards.json");
  CARDS = await res.json();
  QUEUE = dueCards(CARDS);
  updateStats();
  nextCard();
}

function updateStats() {
  const s = srsStats(CARDS);
  document.getElementById("stats-line").textContent =
    `${s.due} para revisar hoje · ${s.learned}/${s.total} consolidados`;
}

function nextCard() {
  FLIPPED = false;
  document.getElementById("flash-actions").style.display = "none";
  if (QUEUE.length === 0) {
    document.getElementById("flash-card").textContent = "Nenhum card pendente por agora. Volte mais tarde ou revise os módulos.";
    CURRENT = null;
    return;
  }
  CURRENT = QUEUE.shift();
  document.getElementById("flash-card").innerHTML = `<div><span class="tag-pill">${CURRENT.materia}</span></div><div style="margin-top:1rem">${CURRENT.frente}</div>`;
}

function flipCard() {
  if (!CURRENT || FLIPPED) return;
  FLIPPED = true;
  document.getElementById("flash-card").innerHTML = `<div><span class="tag-pill">${CURRENT.materia}</span></div><div style="margin-top:1rem">${CURRENT.verso}</div>`;
  document.getElementById("flash-actions").style.display = "flex";
}

function grade(g) {
  if (!CURRENT) return;
  gradeCard(CURRENT.id, g);
  updateStats();
  nextCard();
}

loadCards();
</script>
</body>
</html>
