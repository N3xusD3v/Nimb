<body>
<header class="topbar">
  <div class="brand">
    <img src="img/nexus-mark.png" alt="" width="24" height="24" style="border-radius:6px;" />
    Nimb <span class="tag">IFRH · ANAC</span>
  </div>
  <nav class="mainnav">
    <a href="painel.html">Painel</a>
    <a href="regulamento.html">Regulamento</a>
    <a href="meteorologia.html">Meteorologia</a>
    <a href="navegacao.html">Navegação</a>
    <a href="calculadoras.html">Calculadoras</a>

    <a href="flashcards.html" class="active">Flashcards</a>
    <a href="plano.html">Plano 15 dias</a>
    <a href="recursos.html">Recursos</a>
  </nav>
    <button class="cmdk-trigger" onclick="openPalette()" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      Buscar <kbd>Ctrl K</kbd>
    </button>
</header>
<main>
  <h1>Flashcards (revisão espaçada)</h1>
  <p style="color:var(--text-dim)" id="stats-line">Carregando...</p>
  <div class="flash-card" id="flash-card" onclick="flipCard()">Carregando...</div>
  <div class="flash-actions" id="flash-actions" style="display:none">
    <button class="secondary" onclick="grade(0)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9.5 9.5 5 5"/><path d="m14.5 9.5-5 5"/></svg>
      Errei
    </button>
    <button class="secondary" onclick="grade(1)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 15h6"/><circle cx="9" cy="10" r="0.7" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="0.7" fill="currentColor" stroke="none"/></svg>
      Difícil
    </button>
    <button onclick="grade(2)">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.5 2.5L16 9.3"/></svg>
      Fácil
    </button>
  </div>
</main>
<footer>Nimb · algoritmo de repetição espaçada simplificado (estilo SM-2).</footer>
<script src="js/app.js?v=4"></script>
<script src="js/palette.js?v=4"></script>
<script src="js/srs.js?v=4"></script>
<script>
let CARDS = [];
let QUEUE = [];
let CURRENT = null;
let FLIPPED = false;

async function loadCards() {
  const res = await fetch("data/flashcards.json");
  const base = await res.json();
  const missed = getMissedCards();
  CARDS = [...missed, ...base];
  // due cards first, with missed-question cards (from wrong quiz answers) prioritized
  QUEUE = dueCards(CARDS).sort((a, b) => (a.tag ? 0 : 1) - (b.tag ? 0 : 1));
  updateStats();
  nextCard();
}

function updateStats() {
  const s = srsStats(CARDS);
  const missedDue = dueCards(getMissedCards()).length;
  document.getElementById("stats-line").textContent =
    `${s.due} para revisar hoje` + (missedDue > 0 ? ` (${missedDue} de erros de simulado)` : "") + ` · ${s.learned}/${s.total} consolidados`;
}

function nextCard() {
  FLIPPED = false;
  document.getElementById("flash-actions").style.display = "none";
  if (QUEUE.length === 0) {
    document.getElementById("flash-card").textContent = "Nenhum card pendente por agora. Volte mais tarde ou revise os módulos.";
    CURRENT = null;
    return;
  }
  CURRENT = QUEUE.shift();
  const tagHtml = CURRENT.tag
    ? `<span class="tag-pill" style="background:rgba(255,107,107,0.15); color:var(--danger);">${CURRENT.tag}</span> `
    : "";
  document.getElementById("flash-card").innerHTML = `<div><span class="tag-pill">${materiaLabelSrs(CURRENT.materia)}</span> ${tagHtml}</div><div style="margin-top:1rem">${CURRENT.frente}</div>`;
}

function materiaLabelSrs(m) {
  return { regulamento: "Regulamento", meteorologia: "Meteorologia", navegacao: "Navegação" }[m] || m;
}

function flipCard() {
  if (!CURRENT || FLIPPED) return;
  FLIPPED = true;
  const tagHtml = CURRENT.tag
    ? `<span class="tag-pill" style="background:rgba(255,107,107,0.15); color:var(--danger);">${CURRENT.tag}</span> `
    : "";
  document.getElementById("flash-card").innerHTML = `<div><span class="tag-pill">${materiaLabelSrs(CURRENT.materia)}</span> ${tagHtml}</div><div style="margin-top:1rem">${CURRENT.verso}</div>`;
  document.getElementById("flash-actions").style.display = "flex";
}

function grade(g) {
  if (!CURRENT) return;
  gradeCard(CURRENT.id, g);
  recordActivity();
  updateStats();
  nextCard();
}

loadCards();
</script>
</body>
</html>
